name: release
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "bad version '$env:VERSION'" }
          $out = gh release view "v$env:VERSION" 2>&1
          if ($LASTEXITCODE -eq 0) { throw "release v$env:VERSION already exists" }
          if ("$out" -notmatch 'release not found') { throw "gh release view failed: $out" }
          exit 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pyinstaller==6.13.0
      - name: Build
        shell: cmd
        run: |
          set PY=python
          set OUT=%RUNNER_TEMP%\build
          call build_exe.bat
          if errorlevel 1 exit /b 1
      - name: Check the exe bundles every imported module
        run: |
          python .github\check_bundle.py . rcalc dist\rcalc.exe
          if ($LASTEXITCODE -ne 0) { throw "bundle check failed" }
      - name: Publish
        run: |
          gh release create "v$env:VERSION" dist\rcalc.exe --title "rcalc $env:VERSION" --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
